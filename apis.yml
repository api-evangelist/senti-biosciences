name: Senti Biosciences
description: 'Senti Biosciences (Nasdaq: SNTI) is a clinical-stage biotechnology company based in
  South San Francisco, California that engineers programmable "Gene Circuits" into cell and gene
  therapies to treat cancer with greater precision and control. Its lead candidate, SENTI-202, is an
  off-the-shelf logic-gated CAR NK cell therapy in clinical trials for acute myeloid leukemia and other
  hematologic malignancies. The company was surfaced as a portfolio company of lux-capital and
  menlo-ventures. As a therapeutics company it exposes no public developer API, SDK, or documentation
  surface; this profile captures its identity and probed domain-security posture.'
